name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: pip install pytest
      - name: Run every entry's tests
        run: |
          set -e
          for d in python/*/; do [ -f "$d/test_solution.py" ] && (cd "$d" && echo "== $d" && python -m pytest -q); done
          for d in typescript/*/; do [ -f "$d/solution.test.ts" ] && (cd "$d" && echo "== $d" && npx --yes tsx --test solution.test.ts); done
          for d in java/*/; do [ -f "$d/SolutionTest.java" ] && (cd "$d" && echo "== $d" && javac *.java && java -ea SolutionTest); done
          for d in cpp/*/; do [ -f "$d/test.cpp" ] && (cd "$d" && echo "== $d" && g++ -std=c++17 -Wall -o test test.cpp && ./test); done
          echo "all green"
